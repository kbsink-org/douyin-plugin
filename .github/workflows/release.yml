name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      # Layout: douyin-plugin/ + kbsink/ (replace ../kbsink in go.mod)
      - uses: actions/checkout@v4
        with:
          path: douyin-plugin

      - uses: actions/checkout@v4
        with:
          repository: kbsink-org/kbsink
          ref: main
          path: kbsink

      - uses: actions/setup-go@v5
        with:
          go-version-file: douyin-plugin/go.mod
          cache-dependency-path: douyin-plugin/go.sum

      - name: Build and pack
        working-directory: douyin-plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          mkdir -p release

          build_one() {
            local bin="$1"
            local pkg="$2"
            local out="$bin"
            if [ "$GOOS" = "windows" ]; then out="${out}.exe"; fi
            go build -trimpath -ldflags="-s -w" -o "$out" "$pkg"
            local asset="${bin}_${ver}_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              local final="${asset}.exe"
              mv "$out" "$final"
              zip -j -q "release/${asset}.zip" "$final"
            else
              local final="$asset"
              mv "$out" "$final"
              tar -czf "release/${asset}.tar.gz" "$final"
            fi
          }

          # Full kb-sink-md CLI with Douyin registered (--plugin douyin); Converter runs in-process in kbsink.
          build_one "kb-sink-md-douyin" "./cmd/kb-sink-md-douyin"
          # Small smoke-test binary (direct Converter), optional for integrators.
          build_one "douyin-plugin" "./cmd/douyin-plugin"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: douyin-plugin/release/*

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: SHA256 checksums
        run: |
          set -euo pipefail
          cd dist
          : > SHA256SUMS.txt
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] || continue
            shasum -a 256 "$f" >> SHA256SUMS.txt
          done
          sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
